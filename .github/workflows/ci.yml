name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use a current npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Verify (type-check, tests, build)
        run: npm run verify
      - name: Pack, then use the tarball the way a consumer would
        run: |
          npm pack
          node scripts/smoke-pack.mjs pico-mcp-*.tgz
